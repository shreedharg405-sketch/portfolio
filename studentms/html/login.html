<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Sign In</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS Modules -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/forms.css">
</head>

<body style="background: radial-gradient(circle at top right, #1e293b, #0f172a); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

    <!-- Network Loader overlay -->
    <div class="network-status-pill hidden" id="network-status-pill">
        <div class="network-spinner"></div>
        <span id="network-status-text">Loading...</span>
    </div>

    <!-- Main Authentication Layout -->
    <div style="width: 100%; max-width: 440px; background-color: var(--bg-secondary); border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-xl); overflow: hidden; position: relative;">
        <!-- Gold Decorative Accent top border -->
        <div style="height: 4px; background: linear-gradient(90deg, var(--accent-color), #f1c40f);"></div>
        
        <div style="padding: 40px 30px;">
            <!-- Brand Info Header -->
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="width: 50px; height: 50px; background-color: var(--accent-light); color: var(--accent-color); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px; border: 1px solid rgba(212, 160, 23, 0.2);">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 style="font-size: 20px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">Student Management System</h1>
                <p style="font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px;">College Portal Login</p>
            </div>

            <!-- Tab Switchers -->
            <div style="display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; gap: 20px; justify-content: center;">
                <button id="tab-login" style="background: none; border: none; font-size: 14px; font-weight: 700; padding: 10px 16px; cursor: pointer; color: var(--accent-color); border-bottom: 2px solid var(--accent-color); transition: all var(--transition-fast);">Log In</button>
                <button id="tab-signup" style="background: none; border: none; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; transition: all var(--transition-fast);">Sign Up</button>
            </div>

            <!-- Log In Form -->
            <form id="login-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">
                <div class="floating-group" id="login-email-group">
                    <input type="email" id="login-email" placeholder="Email Address" required>
                    <label for="login-email">Email Address</label>
                    <span class="error-msg" id="login-email-error"></span>
                </div>
                
                <div class="floating-group" id="login-password-group">
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Password" required style="padding-right: 48px;">
                        <label for="login-password">Password</label>
                        <span class="toggle-password-btn" id="toggle-login-pass">
                            <i class="fa-solid fa-eye eye-icon"></i>
                        </span>
                    </div>
                    <span class="error-msg" id="login-password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="padding: 12px; margin-top: 10px;">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>
                
                <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 10px;">
                    Need a portal account? <span id="link-to-signup" style="color: var(--accent-color); font-weight: 600; cursor: pointer; text-decoration: underline;">Sign up now</span>
                </p>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Script modules import -->
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
