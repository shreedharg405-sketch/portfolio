<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank You — Message Received | SHREEDHAR G Portfolio">
    <title>Thank You — SHREEDHAR G</title>

    <script src="../js/theme.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .thanks-wrapper {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }
        .thanks-card {
            max-width: 560px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            border-radius: var(--radius-lg);
        }
        .thanks-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #10B981;
            font-size: 2.5rem;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
            margin-bottom: 0.5rem;
        }
        .thanks-title {
            font-size: clamp(1.8rem, 3.5vw, 2.4rem);
            font-weight: 800;
            color: var(--text-primary);
        }
        .thanks-title span {
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .thanks-desc {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.7;
            font-family: var(--font-secondary);
        }
        .thanks-actions {
            margin-top: 1rem;
        }
    </style>
</head>

<body>

    <!-- Mouse Spotlight -->
    <div id="mouseSpotlight" class="mouse-spotlight"></div>

    <!-- Full-screen Loading Screen -->
    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-logo">GS<span>.</span></div>
            <div class="loader-bar-track">
                <div class="loader-bar-fill"></div>
            </div>
            <p class="loader-text">Loading Page...</p>
        </div>
    </div>

    <div class="bg-effects" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <canvas id="particleCanvas" class="particle-canvas"></canvas>
    </div>

    <!-- Header Navbar -->
    <header class="header" id="header">
        <a href="../index.html#home" class="logo">GS<span>.</span></a>
        <div class="nav-actions">
            <button id="themeSwitchBtn" class="theme-switch" aria-label="Toggle theme" title="Toggle Light/Dark mode">
                <span class="switch-slider">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </span>
            </button>
        </div>
    </header>

    <main class="thanks-wrapper">
        <div class="thanks-card glass-card">
            <div class="thanks-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1 class="thanks-title">Message Sent <span>Successfully</span></h1>
            <p class="thanks-desc">Thank you for contacting me. Your message has been received. I will get back to you soon.</p>
            <div class="thanks-actions">
                <a href="../index.html" class="btn btn-primary ripple-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Portfolio</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Public Footer Component -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-logo">SHREEDHAR G<span>.</span></div>
            <p class="footer-tagline">"Designed &amp; Developed with ❤️ using HTML, CSS &amp; JavaScript"</p>
            <div class="footer-divider"></div>
            <p class="footer-copy">&copy; SHREEDHAR G. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="../js/cursor.js?v=1785835000"></script>
    <script src="../js/particles.js?v=1785840000"></script>
    <script src="../js/main.js?v=1785835000"></script>
</body>

</html>
