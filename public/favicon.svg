<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFC2"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="gradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFC2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Squircle Background Matching Portfolio Forest Palette -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#064734"/>
  <!-- Signature High-Tech Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#gradBorder)" stroke-width="2.5"/>
  <!-- Monogram Logo GS (Space Grotesk / High-Tech Modern) -->
  <text x="32" y="34.5" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="800" letter-spacing="-1px" fill="url(#gradText)" text-anchor="middle" dominant-baseline="central">GS</text>
</svg>